name: strumer-verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify required repository files exist
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          required_paths = [
              "README.md",
              "LICENSE",
              "demo/strumer_v2_3.py",
              "demo/STRUMER_HTML_v2_3.html",
              "docs/Quickstart.md",
              "docs/FAQ.md",
              "docs/Proof-Sketch.md",
              "docs/STRUMER-Architecture-Notes.md",
              "docs/STRUMER-Challenge.md",
              "docs/STRUMER_v1.2.pdf",
              "docs/STRUMER-Diagram.png",
              "docs/Dependency-Elimination-Framework.png",
              "docs/Shunyaya-Structural-Stack.png",
              "VERIFY/VERIFY.txt",
              "VERIFY/FREEZE_DEMO_SHA256.txt",
          ]

          missing = [p for p in required_paths if not Path(p).exists()]
          if missing:
              print("ERROR: Missing required repository files:")
              for p in missing:
                  print(" -", p)
              sys.exit(1)

          print("Required repository files verified.")
          PY

      - name: Verify frozen SHA256 hashes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import re
          import sys
          from pathlib import Path

          freeze_path = Path("VERIFY/FREEZE_DEMO_SHA256.txt")

          targets = {
              "demo/strumer_v2_3.py": Path("demo/strumer_v2_3.py"),
              "demo/STRUMER_HTML_v2_3.html": Path("demo/STRUMER_HTML_v2_3.html"),
          }

          freeze_text = freeze_path.read_text(encoding="utf-8", errors="replace")

          def sha256_file(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          for label, path in targets.items():
              pattern = rf"{re.escape(label)}\s*SHA256:\s*([0-9a-f]{{64}})"
              match = re.search(pattern, freeze_text, re.IGNORECASE)

              if not match:
                  print(f"ERROR: No frozen SHA256 entry found for {label}")
                  sys.exit(1)

              expected = match.group(1).lower()
              actual = sha256_file(path).lower()

              if actual != expected:
                  print(f"ERROR: Hash mismatch for {label}")
                  print("Expected:", expected)
                  print("Actual:  ", actual)
                  sys.exit(1)

              print(f"Hash verified for {label}: {actual}")

          print("Frozen SHA256 verification completed.")
          PY

      - name: Run STRUMER Python demo
        shell: bash
        run: |
          python demo/strumer_v2_3.py

      - name: Verify STRUMER output markers
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import sys

          cmd = [sys.executable, "demo/strumer_v2_3.py"]
          result = subprocess.run(cmd, capture_output=True, text=True, check=True)
          out = result.stdout

          required_markers = [
              "STRUMER",
              "Structural Media Resolution",
              "video_visible iff",
              "RESOLVED",
              "ABSTAIN",
              "BLOCKED",
          ]

          missing = [m for m in required_markers if m not in out]
          if missing:
              print("ERROR: STRUMER output missing expected markers:")
              for m in missing:
                  print(" -", m)
              print("\nFull output:\n", out)
              sys.exit(1)

          print("STRUMER output markers verified.")
          PY

      - name: Verify deterministic output
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import sys

          cmd = [sys.executable, "demo/strumer_v2_3.py"]

          r1 = subprocess.run(cmd, capture_output=True, text=True, check=True)
          r2 = subprocess.run(cmd, capture_output=True, text=True, check=True)

          if r1.stdout != r2.stdout:
              print("ERROR: Non-deterministic STRUMER output")
              sys.exit(1)

          print("Deterministic STRUMER output verified.")
          PY

      - name: Verify README contains core STRUMER claims
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          text = Path("README.md").read_text(encoding="utf-8", errors="replace")

          required = [
              "Structural Media Resolution",
              "video_output = resolve(structure)",
              "video_visible iff video_structure_complete AND video_structure_consistent",
              "same structure -> same video",
              "STRUMER Challenge",
              "demo/strumer_v2_3.py",
              "VERIFY/FREEZE_DEMO_SHA256.txt",
          ]

          missing = [r for r in required if r not in text]
          if missing:
              print("ERROR: README missing STRUMER claims:")
              for r in missing:
                  print(" -", r)
              sys.exit(1)

          print("README core claims verified.")
          PY
